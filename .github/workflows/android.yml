
name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'SubDubFa_updated.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          mkdir -p extracted
          unzip -o SubDubFa_updated.zip -d extracted

          if [ -f extracted/app/build.gradle.kts ]; then
            echo "PROJECT_DIR=extracted" >> "$GITHUB_ENV"
          elif [ -f extracted/SubDubFa/app/build.gradle.kts ]; then
            echo "PROJECT_DIR=extracted/SubDubFa" >> "$GITHUB_ENV"
          else
            echo "Project structure not found"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --refresh-dependencies assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SubDubFa-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
