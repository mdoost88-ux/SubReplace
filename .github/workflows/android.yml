name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'SubDubFa_source.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          if [ -f SubDubFa_source.zip ]; then
            unzip -o SubDubFa_source.zip
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p SubDubFa assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SubDubFa-APK
          path: SubDubFa/app/build/outputs/apk/debug/app-debug.apk
